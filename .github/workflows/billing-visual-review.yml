name: Billing visual review capture

on:
  pull_request:
    branches: [main]

jobs:
  capture:
    if: github.head_ref == 'codex/interface-polish' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'dianuhs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Capture invented-data screens for review
        working-directory: frontend
        run: npm run test:visual -- billing-upload.contract.spec.js --update-snapshots --workers=2 --grep 'Lumen answers locally'
      - name: Save PNG evidence on this draft branch only
        run: node scripts/save-review-snapshots.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CCG_REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
