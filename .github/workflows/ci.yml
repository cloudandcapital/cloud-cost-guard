name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Validate the unified demo report
        working-directory: frontend
        run: npm run validate:data

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: true
        run: npm test -- --watchAll=false

      - name: Run API safety tests
        working-directory: frontend
        run: npm run test:api

      - name: Build optimized frontend
        working-directory: frontend
        env:
          CI: true
        run: npm run build

      - name: Install Chromium for visual contract tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Verify optimized production bundle mounts
        working-directory: frontend
        run: npm run test:production-mount

      - name: Run structural, interaction, and visual contract tests
        working-directory: frontend
        run: npm run test:visual

      - name: Upload visual-contract failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-contract-failure-evidence
          if-no-files-found: error
          path: |
            frontend/test-results/visual-contract
            frontend/visual-contract/snapshots

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install released CCAC validator
        run: python -m pip install --disable-pip-version-check "cloudandcapital-ccac @ https://github.com/cloudandcapital/cloud-capital-analysis-contract/releases/download/v0.2.0/cloudandcapital_ccac-0.2.0-py3-none-any.whl#sha256=bc46f363b1a03c94cf0da75759bccd0271de2c53b1f77a1a7255f9c8e7f768f1"

      - name: Validate static CCAC fixture integrity
        run: python scripts/validate_ccac_fixture.py fixtures/ccac/illustrative-v0.2.1/run

      - name: Regenerate deterministic CCAC dashboard view
        run: python scripts/build_ccac_dashboard_view.py --output "$RUNNER_TEMP/ccac-dashboard-view.generated.json"

      - name: Verify tracked CCAC dashboard view is current
        run: cmp "$RUNNER_TEMP/ccac-dashboard-view.generated.json" frontend/src/data/ccac-dashboard-view.generated.json

      - name: Run CCAC dashboard projection tests
        run: python -m unittest tests.test_ccac_dashboard_view -v

      - name: Run CCAC fixture adversarial tests
        run: python -m unittest tests.test_ccac_fixture -v

      - name: Validate static CCAC 1.1 fixture integrity
        run: python scripts/validate_ccac11_fixture.py fixtures/ccac/illustrative-v0.3.0/run

      - name: Run released CCAC 1.1 complete-run validation
        run: ccac validate-run fixtures/ccac/illustrative-v0.3.0/run

      - name: Regenerate deterministic CCAC 1.1 dashboard view
        run: python scripts/build_ccac11_dashboard_view.py --output "$RUNNER_TEMP/ccac-dashboard-view-v1.1.generated.json"

      - name: Verify tracked CCAC 1.1 dashboard view is current
        run: cmp "$RUNNER_TEMP/ccac-dashboard-view-v1.1.generated.json" frontend/src/data/ccac-dashboard-view-v1.1.generated.json

      - name: Run CCAC 1.1 dashboard projection tests
        run: python -m unittest tests.test_ccac11_dashboard_view -v

      - name: Run CCAC 1.1 fixture adversarial tests
        run: python -m unittest tests.test_ccac11_fixture -v

      - name: Install released Tech Spend Command Center validator
        run: python -m pip install --disable-pip-version-check "git+https://github.com/cloudandcapital/tech-spend-command-center.git@5c06df63cd014867fe3cb2e346e2e97cd2469689"

      - name: Verify released validator version
        run: test "$(techspend --version)" = "techspend, version 0.2.1"

      - name: Run released complete-run validation
        run: techspend summarize fixtures/ccac/illustrative-v0.2.1/run > /dev/null

      - name: Run backend unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
